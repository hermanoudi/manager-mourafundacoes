name: CI
on:
  push:
    branches: [main]
  pull_request:

env:
  TEST_DATABASE_URL: postgresql+psycopg://moura:moura@localhost:5432/moura

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_USER: moura, POSTGRES_PASSWORD: moura, POSTGRES_DB: moura }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U moura" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run ruff check src tests migrations scripts
      - run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_USER: moura, POSTGRES_PASSWORD: moura, POSTGRES_DB: moura }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U moura" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
        working-directory: backend
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      # Só desktop no CI (rápido). Galaxy S23 e iPhone 14 Pro: rodar localmente com `npx playwright test`.
      - run: npx playwright test --project=desktop
        working-directory: frontend
        # Extrator fake (determinístico, sem Gemini) e fotos no diretório temporário do runner.
        # `runner.temp` só existe no nível do step, não no `env` do job.
        env:
          NOTES_EXTRACTOR: fake
          STORAGE_BACKEND: local
          STORAGE_LOCAL_DIR: ${{ runner.temp }}/uploads
